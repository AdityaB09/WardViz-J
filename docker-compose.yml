version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wardviz
      POSTGRES_PASSWORD: wardviz
      POSTGRES_DB: wardviz
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardviz -d wardviz"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wardviz
      SPRING_DATASOURCE_USERNAME: wardviz
      SPRING_DATASOURCE_PASSWORD: wardviz
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
  web:
    build: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on:
      - api
